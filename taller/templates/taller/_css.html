<style>
:root{
  --floor:#dde2e5; --paper:#f7f8f9; --ink:#14202b; --muted:#5b6b78; --line:#c4ccd2;
  --tape:#f2b705; --tape-ink:#3a2c00; --blue:#1f4e79; --ok:#2e7d4f; --ok-bg:#e1f1e7;
  --warn-bg:#fbefc4; --err:#b3392b; --err-bg:#f8dcd7; --idle-bg:#e6ebef;
  --head:"Bahnschrift","Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--floor:#0f171e; --paper:#18232d; --ink:#e8edf1; --muted:#93a3b0; --line:#2b3a47;
    --blue:#7db3e0; --ok:#6fcf97; --ok-bg:#16301f; --warn-bg:#3b3010; --err:#ff8f80;
    --err-bg:#3a1b17; --idle-bg:#1f2c37; --tape-ink:#2a2000}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--floor);color:var(--ink);font:16px/1.45 var(--body)}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
.bar{background:#14202b;color:#fff;border-bottom:6px solid var(--tape)}
.bar-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{font:700 1.5rem/1 var(--head);letter-spacing:.02em;color:#fff;text-decoration:none;display:flex;align-items:center;gap:10px}
.brand i{width:14px;height:26px;background:var(--tape);display:block;transform:skewX(-14deg)}
.tabs{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.tabs a{color:#cfd8df;text-decoration:none;padding:8px 14px;border-radius:6px;font-weight:600}
.tabs a:hover{background:#22313f;color:#fff}
.tabs a[aria-current=page]{background:var(--tape);color:var(--tape-ink)}
.who{display:flex;gap:12px;align-items:center;font-size:.9rem;color:#9fb0bd}
.who a,.who button{color:#cfd8df;background:none;border:0;font:inherit;cursor:pointer;text-decoration:underline;padding:0}
main{max-width:1180px;margin:0 auto;padding:22px 16px 60px}
h1,h2,h3{font-family:var(--head);margin:0;letter-spacing:.01em;line-height:1.1}
h1{font-size:2.1rem} h2{font-size:1.45rem} h3{font-size:1.1rem}
.sub{color:var(--muted);margin:4px 0 0}
.msgs{list-style:none;padding:0;margin:0 0 18px;display:grid;gap:8px}
.msgs li{padding:10px 14px;border-radius:8px;background:var(--ok-bg);border-left:6px solid var(--ok)}
.msgs li.error{background:var(--err-bg);border-color:var(--err)}
.msgs li.info{background:var(--idle-bg);border-color:var(--blue)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.btn{display:inline-block;font:600 .95rem var(--body);padding:9px 14px;border-radius:7px;border:2px solid var(--ink);
  background:var(--paper);color:var(--ink);cursor:pointer;text-decoration:none;min-height:40px}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.main{background:var(--tape);border-color:var(--tape);color:var(--tape-ink)}
.btn.main:hover{background:var(--ink);border-color:var(--ink);color:var(--tape)}
.btn.small{padding:5px 10px;min-height:32px;font-size:.85rem}
.btn.ghost{border-color:var(--line)}

/* nueva cita */
.new{background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:18px;margin-bottom:26px;
  display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px}
.new h2{grid-column:1/-1}
.fields{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-weight:600;font-size:.9rem}
.f input,.f textarea{font:inherit;padding:9px 10px;border:2px solid var(--line);border-radius:6px;background:#fff;color:#111;width:100%}
@media (prefers-color-scheme:dark){.f input,.f textarea{background:#0f171e;color:var(--ink)}}
.f input:focus,.f textarea:focus{border-color:var(--ink);outline:none}
.f .err{color:var(--err);font-size:.85rem;margin:0}
.c-date{grid-column:span 2}.c-client{grid-column:span 4}.c-phone{grid-column:span 3}.c-plate{grid-column:span 3}.c-note{grid-column:1/-1}
.f textarea{font-size:1.1rem}
.read{border:2px dashed var(--line);border-radius:8px;padding:14px;min-height:150px;align-self:stretch}
.read h3{margin-bottom:8px;color:var(--muted);font-size:1rem}
.read dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px}
.read dt{color:var(--muted)} .read dd{margin:0;font-weight:600}
.read .empty{color:var(--muted);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--idle-bg);border-radius:5px;padding:2px 8px;font-size:.88rem;font-weight:500}
.submit{grid-column:1/-1;display:flex;gap:12px;align-items:center;justify-content:flex-end}

/* tablero */
.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;align-items:start}
.col>header{display:flex;align-items:baseline;gap:10px;border-bottom:3px solid var(--ink);padding-bottom:6px;margin-bottom:12px}
.col>header span{color:var(--muted)}
.stack{display:grid;gap:10px}
.empty-col{border:2px dashed var(--line);border-radius:8px;padding:18px;color:var(--muted)}
.ficha{background:var(--paper);border:1px solid var(--line);border-left:8px solid var(--idle-bg);border-radius:8px;
  padding:12px 14px;display:grid;gap:8px}
.ficha.s-pedir_hoy{border-left-color:var(--tape)}
.ficha.s-pedido{border-left-color:var(--ok)}
.ficha.s-por_pedir{border-left-color:var(--blue)}
.ficha.s-hecha{opacity:.72;border-left-color:var(--muted)}
.ficha.s-sin_recambios{border-left-color:var(--line)}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.top h3{font-size:1.25rem}
.who2{color:var(--muted);font-size:.95rem}
.plate{display:inline-flex;align-items:stretch;border:2px solid #1b1b1b;border-radius:5px;background:#fff;color:#111;
  font:700 .95rem/1 var(--head);letter-spacing:.08em;overflow:hidden;white-space:nowrap;flex:none}
.plate b{background:#0a3f9c;color:#fff;font-size:.6rem;padding:4px 4px;display:flex;align-items:center;font-weight:700;letter-spacing:0}
.plate span{padding:5px 8px}
.parts{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.82rem;font-weight:600;background:var(--idle-bg)}
.pill.pedir_hoy{background:var(--warn-bg)} .pill.pedido{background:var(--ok-bg);color:var(--ok)}
.pill.por_pedir{color:var(--blue)}
.foot{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts form{margin:0}
.note-raw{font-size:.88rem;color:var(--muted);font-style:italic}
.alert{background:var(--warn-bg);border:2px solid var(--tape);border-radius:8px;padding:12px 14px;margin-bottom:22px;
  display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.late{margin-top:26px}
.side{margin-top:26px}
.side ul{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.side li{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px 12px}

/* semana */
.weeknav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;align-items:start}
.day{background:color-mix(in srgb,var(--paper) 55%,transparent);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:140px}
.day.today{border:2px solid var(--ink);background:var(--paper)}
.day.weekend{opacity:.8}
.day>h3{display:flex;justify-content:space-between;font-size:1rem;margin-bottom:8px;text-transform:capitalize}
.day>h3 small{font:600 .75rem var(--body);background:var(--tape);color:var(--tape-ink);border-radius:4px;padding:1px 6px;text-transform:none}
.day .ficha{padding:8px 10px;gap:6px}
.day .top{flex-direction:column}
.day h3.t{font-size:1.02rem}

/* tablas */
.tbl{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tbl th,.tbl td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font:600 .9rem var(--body);color:var(--muted);background:var(--idle-bg)}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.search{display:flex;gap:8px}
.search input{font:inherit;padding:8px 10px;border:2px solid var(--line);border-radius:6px;min-width:220px;background:#fff;color:#111}
.ok{color:var(--ok);font-weight:600}.no{color:var(--muted)}
.copy{font-size:.8rem}

/* login */
.login{max-width:380px;margin:9vh auto;background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:26px}
.login .f{margin:14px 0}

@media (max-width:980px){
  .wk{grid-template-columns:1fr}
  .day{min-height:0}
  .day.weekend:not(:has(.ficha)){display:none}
}
@media (max-width:760px){
  .new{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
  .c-date,.c-client,.c-phone,.c-plate,.c-third{grid-column:1/-1}
  h1{font-size:1.7rem}
  .tbl{display:block;overflow-x:auto}
}
.btn.busy{pointer-events:none;opacity:.85;display:inline-flex;align-items:center;gap:8px}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;
  display:inline-block;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.busybar{position:fixed;left:0;right:0;top:0;height:4px;background:var(--tape);transform-origin:left;
  animation:load 1.6s ease-in-out infinite;z-index:50}
@keyframes load{0%{transform:scaleX(0)}60%{transform:scaleX(.8)}100%{transform:scaleX(1);opacity:.2}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}.busybar{animation:none;transform:none}}
.sbox input{font:inherit;font-size:.9rem;padding:7px 10px;border-radius:6px;border:1px solid #3a4b5a;background:#1b2a37;color:#fff;width:220px}
.sbox input::placeholder{color:#8fa1af}
.ficha.s-fallo{border-left-color:var(--err)}
.pill.fallo{background:var(--err-bg);color:var(--err)}
.alert.fail{background:var(--err-bg);border-color:var(--err)}
.errline{margin:0;color:var(--err);font-size:.88rem}
.acts-row,.head .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.c-hist{grid-column:1/-1}
.c-third{grid-column:span 2}
.hist{border:1px solid var(--line);border-left:6px solid var(--blue);border-radius:6px;padding:8px 12px;background:var(--idle-bg);font-size:.92rem}
.hist ul{margin:6px 0 0;padding-left:18px}.hist .btn{margin-top:6px}
.fields.wide .c-note{grid-column:1/-1}
.check{display:flex;gap:8px;align-items:center;font-size:.92rem}
.check input{width:auto}
.edit{grid-template-columns:1fr}
.peditor{display:grid;gap:6px}
.prow{display:grid;grid-template-columns:2fr 1.3fr .7fr .6fr;gap:6px}
.prow input{font:inherit;padding:7px 9px;border:2px solid var(--line);border-radius:6px;background:#fff;color:#111;min-width:0}
@media (prefers-color-scheme:dark){.prow input,.prices input,.sbox input{background:#0f171e;color:var(--ink)}}
.phead{font-size:.82rem;color:var(--muted);font-weight:600}
.phint{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:.85rem;flex-wrap:wrap}
.rev .top{align-items:center}.rev .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.send{display:flex;gap:12px;align-items:center;cursor:pointer}.send input{width:22px;height:22px}
.sticky{position:sticky;bottom:0;display:flex;gap:10px;justify-content:flex-end;padding:12px 0;margin-top:14px;background:linear-gradient(transparent,var(--floor) 30%)}
.prices input{font:inherit;padding:6px 8px;border:2px solid var(--line);border-radius:6px;width:110px;text-align:right;background:#fff;color:#111}
.prices input[name=new_name]{width:100%;text-align:left}
@media (max-width:760px){.sbox input{width:100%}.sbox{order:5;flex:1 1 100%}.prow{grid-template-columns:1fr 1fr}.prow .unit{grid-column:auto}}
.prow2{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:8px 0}
.prow2>input{flex:1 1 260px;font:inherit;padding:8px 10px;border:2px solid var(--line);border-radius:6px;background:#fff;color:#111}
.prow2 input[name=labor],.prow2 input[name=extra_price]{width:120px;text-align:right;font:inherit;padding:7px 9px;border:2px solid var(--line);border-radius:6px;background:#fff;color:#111}
.totals{display:grid;grid-template-columns:1fr auto;gap:4px 16px;margin:18px 0 0;max-width:340px;margin-left:auto;font-variant-numeric:tabular-nums}
.totals dd{margin:0;text-align:right}.totals dt:last-of-type,.totals dd:last-of-type{font-size:1.2rem}
.read .think{display:flex;gap:8px;align-items:center;color:var(--muted);margin:0}
.engine{font-size:.82rem;color:var(--muted);margin:12px 0 0}.engine.gemma{color:var(--ok);font-weight:600}
.warnline{margin:10px 0 0;padding:6px 10px;background:var(--warn-bg);border-radius:6px;font-size:.9rem}
@media print{.sticky,.sbox,.who,.weeknav{display:none}}
@media print{.bar,.new,.acts,.msgs{display:none}}
@media (prefers-reduced-motion:no-preference){
  .read dl{animation:swap .18s ease-out}
  @keyframes swap{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}
}
</style>
